<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aardschok · proefje</title>
  <link rel="stylesheet" href="stijl.css">
</head>
<body>
  <canvas id="scherm"></canvas>

  <div id="hud">
    <button id="sluip-knop" class="paneel" title="Sluipen: trager, maar monsters merken je pas van dichterbij op"><kbd>S</kbd> Sluipen</button>
    <div id="goud" class="paneel verborgen" title="Goud. Het koopt spullen en gunsten, nooit jaren."><span class="munt">&#9679;</span> <span id="goud-aantal">0</span></div>
    <div id="inventaris"></div>
  </div>

  <!-- Het scherm van het gehuchtspel (js/hud.js): aan met ?hud of ?kaart=gehucht in de
       adresbalk, en dan gaan de panelen hierboven weg (stijl.css, .nieuwe-hud). -->
  <div id="hud-gehucht">
    <div id="kalenderbalk" class="paneel">
      <div id="kalender-knoppen">
        <button data-snelheid="0" title="Pauzeer de tijd (P)"><kbd>P</kbd> Pauze</button>
        <button data-snelheid="1" title="Gewone snelheid">1×</button>
        <button data-snelheid="2" title="Twee keer zo snel">2×</button>
        <button data-snelheid="3" title="Drie keer zo snel: een jaar duurt dan een minuut of vijf">3×</button>
      </div>
      <div id="kalender-datum"></div>
      <div id="kalender-seizoen"></div>
      <!-- Wat de heer op Sint-Maarten wil, vanaf zijn brief (js/heer.js, js/hud.js). -->
      <div id="aanslag" class="verborgen"></div>
    </div>
    <div id="voorraadbalk" class="paneel"></div>
    <button id="bouwmenu-knop" class="paneel" title="Bouwen"><kbd>B</kbd> Bouwen</button>
  </div>

  <!-- Het bouwmenu (js/hud.js, T.ui.toonBouwmenu): de soorten van de huidige trede, met hun
       kosten en wat ze doen. Kies er een, en een spookbeeld volgt de muis (js/main.js,
       js/tekenen.js) tot een klik hem neerzet. -->
  <div id="bouwmenu" class="paneel verborgen"></div>

  <div id="plek"></div>
  <div id="volgorde" class="paneel"></div>

  <!-- Onderaan: de actiepunten en knoppen van een gevecht schuiven erbij zodra het begint. -->
  <div id="onder">
    <div id="actiebalk" class="paneel">
      <div id="ap"></div>
      <div id="knoppen">
        <button data-actie="deur" class="verborgen"><kbd>D</kbd> Deur dicht <span class="kost">1</span></button>
        <button data-actie="einde"><kbd>spatie</kbd> Einde beurt</button>
      </div>
    </div>
  </div>

  <div id="berichten"></div>
  <!-- Een vraag aan de speler (js/hud.js, T.ui.vraag): het pannenbier op het hoogste punt, later
       de voorvallen. Blijft staan tot er een antwoord is. -->
  <div id="vraag" class="paneel verborgen"></div>
  <!-- Handelen met de marskramer (js/hud.js, T.ui.openHandel; de regels in js/handel.js). -->
  <div id="handel" class="paneel verborgen"></div>
  <!-- Een verstopplek: erin of eruit (js/hud.js, T.ui.openVerstop; de regels in js/inner.js). -->
  <div id="verstop" class="paneel verborgen"></div>
  <!-- De heer zet je af (js/heer.js, T.zetAf): het spel is voorbij. -->
  <div id="afgezet" class="verborgen"><div class="paneel"><div class="kop"></div><p></p><button>Opnieuw beginnen</button></div></div>
  <div id="tooltip" class="verborgen"></div>

  <div id="dialoog" class="paneel verborgen">
    <div id="dialoog-naam"></div>
    <p id="dialoog-tekst"></p>
    <div id="dialoog-keuzes"></div>
  </div>

  <div id="overlay" class="verborgen">
    <div class="paneel kaart">
      <h1 id="overlay-titel"></h1>
      <div id="overlay-tekst"></div>
      <button id="overlay-knop"></button>
    </div>
  </div>

  <div id="hulp">
    Klik om te lopen, te praten of iets te gebruiken. <kbd>S</kbd> sluipen<br>
    In een gevecht: <kbd>1</kbd> slaan · <kbd>D</kbd> deur dicht · <kbd>spatie</kbd> einde beurt
  </div>

  <div id="hulp-gehucht">
    Klik om te lopen, te praten of iets te gebruiken.<br>
    Kalender: <kbd>P</kbd> pauze/hervat · <kbd>-</kbd> <kbd>=</kbd> trager/sneller<br>
    <kbd>B</kbd> bouwen · <kbd>Esc</kbd> of rechtsklik legt een gebouw weer weg
  </div>

  <!-- Gewone scripts, geen modules: zo werkt het spel ook als je index.html los opent.
       beelden/beschrijving.js hoort bij de pixel art (gemaakt door naar-spel.cjs), tegels/tegels.js
       en kaarten/kaarten.js bij de kaarten die Marcel in Tiled tekent (naar-tiled.cjs, npm run
       tiled, en naar-kaarten.cjs, npm run kaarten): alle drie als script, want fetch mag niet
       vanaf file://. -->
  <script src="beelden/beschrijving.js"></script>
  <script src="tegels/tegels.js"></script>
  <script src="tegels/bouwfasen.js"></script>
  <script src="tegels/bouwfasen-sdf.js"></script>
  <script src="kaarten/kaarten.js"></script>
  <script src="js/tijd.js"></script>
  <script src="js/voorraad.js"></script>
  <script src="js/wereld.js"></script>
  <script src="js/mensen.js"></script>
  <script src="js/gebouwen.js"></script>
  <script src="js/bouwen.js"></script>
  <script src="js/handel.js"></script>
  <script src="js/heer.js"></script>
  <script src="js/inner.js"></script>
  <script src="js/behoeften.js"></script>
  <script src="js/kaart.js"></script>
  <script src="js/gebied.js"></script>
  <script src="js/pad.js"></script>
  <script src="js/akkers.js"></script>
  <script src="js/iso.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/gesprekken.js"></script>
  <script src="js/gesprek.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/quest.js"></script>
  <script src="js/dialoog.js"></script>
  <script src="js/verkennen.js"></script>
  <script src="js/gevecht.js"></script>
  <script src="js/tekenen.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
