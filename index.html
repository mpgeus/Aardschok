<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{naam}</title>
  <script src="js/naam.js"></script>
  <!-- De taal (vraag 147): T.t en de talen, vóór alle regels, want een tabel kan bij het laden al een zin vragen. -->
  <script src="js/taal.js"></script>
  <link rel="stylesheet" href="stijl.css">
</head>
<body>
  <canvas id="scherm"></canvas>

  <div id="hud">
    <div id="goud" class="paneel verborgen" data-t-title="goud"><span class="munt">&#9679;</span> <span id="goud-aantal">0</span></div>
  </div>

  <!-- Het scherm van het gehuchtspel (js/hud.js): altijd aan (T.NIEUWE_HUD), en dan gaan de
       panelen hierboven weg (stijl.css, .nieuwe-hud). Bovenaan een dunne balk (vraag 166), en daaronder alleen briefjes:
       linksboven het doel met de raad (#opdracht, js/ui.js) en de statussen eronder, rechts na een klik op een gebouw zijn
       briefje. Alle kaartjes zijn even breed (--kaart in stijl.css). De spelregels staan in het menu. -->
  <div id="hud-gehucht">
    <!-- De balk bovenaan (js/balk.js; vraag 166, Marcel: "Bovenaan een dunne ui balk met goud, aantal inwoners, happiness
         jaar en tijd", en "zo leeg mogelijk zonder info te missen"): links het dorp, in het midden de datum en de tijd
         (het seizoen en het weer bij de muis), rechts de snelheid, de twee bazen en Menu. -->
    <div id="bovenbalk" class="briefje">
      <div class="balk-links"><div class="balk-dorp"></div></div>
      <div id="kalenderbalk" data-ding="datum"><span id="kalender-datum"></span><span id="kalender-seizoen"></span></div>
      <div class="balk-rechts">
        <div id="kalender-knoppen" role="group">
          <button data-snelheid="0" data-toets="P"></button>
          <button data-snelheid="1"></button>
          <button data-snelheid="3"></button>
          <button data-snelheid="10"></button>
          <button data-snelheid="30"></button>
        </div>
        <div id="bazen" class="verborgen">
          <div class="baas" data-ding="gunst"><span class="naam"></span><span class="getal">50</span></div>
          <div class="baas" data-ding="vertrouwen"><span class="naam"></span><span class="getal">50</span></div>
        </div>
        <button id="menu-knop" data-ding="menu" data-t="menu"></button>
      </div>
    </div>
    <div id="linksboven">
      <div id="opdracht" class="briefje verborgen"></div>
      <!-- De statussen (js/hud.js, T.ui.toonStatussen): honger, droogte, ... zolang ze duren, onder het doel. -->
      <div id="statussen" class="verborgen"></div>
    </div>
    <div id="rechtsboven">
      <!-- Het briefje van een gebouw (js/gebouwbriefje.js, vraag 156): wat het doet en maakt, na een klik erop. -->
      <div id="gebouwbriefje" class="briefje verborgen"></div>
    </div>
  </div>

  <!-- De balk onderaan (js/balk.js; werklijst vraag 164, Marcel, 14 okt: "De oude ui balk aan de onderkant moet leeg.
       En we hebben een minimale nodig"): kaartjes in de hoeken, zoals bovenaan en even breed. Linksonder de voorraad
       (de waren die je hebt), in het midden bouwen, en de brief en de bode zolang ze er zijn, rechtsonder
       de minikaart (vraag 165, zoals in Age of Empires). Het dorp, de datum, de snelheid en de bazen staan sinds vraag
       166 in de balk bovenaan. Wat een knop doet, zit nog aan zijn id. -->
  <div id="linksonder" class="hoek-onder">
    <div id="voorraad" class="briefje verborgen" data-ding="voorraad">
      <div class="voorraad-waren"></div>
    </div>
  </div>
  <div id="middenonder" class="hoek-onder">
    <button id="bouwmenu-knop" class="briefje knop" data-ding="bouwen"></button>
    <button id="brief-knop" class="briefje knop wacht verborgen" data-ding="brief"></button>
    <button id="bode-knop" class="briefje knop verborgen" data-ding="bode"></button>
  </div>
  <div id="rechtsonder" class="hoek-onder">
    <!-- De minikaart (js/minikaart.js, js/balk.js; vraag 165): het hele eiland, zoals bij Age of Empires in de hoek. -->
    <div id="minikaart" class="verborgen"><canvas></canvas></div>
  </div>
  <!-- Het briefje bij de muis (js/balk.js): wat een ding of een getal is, wat het nu zegt, en de toets. -->
  <div id="wenk" class="verborgen" aria-live="polite"></div>

  <!-- Het bouwmenu (js/hud.js, T.ui.toonBouwmenu; vraag 179): boven de knop Build een raster van
       plaatjes van wat je nu kunt bouwen, en bij de muis wat het kost en doet. Kies er een, en
       het spookbeeld volgt de muis (js/main.js, js/tekenen.js; R draait) tot een klik hem neerzet. -->
  <div id="bouwmenu" class="paneel verborgen"></div>

  <!-- Handelen met de marskramer (js/hud.js, T.ui.openHandel; de regels in js/handel.js): wat hij
       verkoopt en wat hij koopt, tegen de prijs van dit bezoek. Je opent het vanuit zijn gesprek. -->
  <div id="handel" class="paneel verborgen"></div>

  <!-- De heer (js/hud.js, T.ui.toonBrief en T.ui.openHeer; de regels in js/heer.js): zijn brief in
       wijnmaand, en het betalen op Sint-Maarten, met de schandpaal als die erbij hoort. -->
  <div id="brief" class="paneel verborgen"></div>
  <div id="heer" class="paneel verborgen"></div>

  <!-- Het slachten (js/hud.js, T.ui.openSlachten; de regels in js/vee.js): op 1 slachtmaand, of
       vanuit het veldenvenster. Wie gaat er naar de slager, en haalt het hooi de winter? -->
  <div id="slachten" class="paneel verborgen"></div>

  <!-- De velden (js/hud.js, T.ui.openVelden; de regels in js/akkers.js en js/vee.js): elk veld met
       van wie het is, hoe vruchtbaar, wat het nu is, en wat het volgend jaar wordt. -->
  <div id="velden" class="paneel verborgen"></div>

  <!-- De wetten (js/wettenmenu.js, T.ui.openWetten; de regels in js/wetten.js): een menu zoals in
       Democracy 3, elke wet een kaart met wat hij doet, en een knop om hem aan te nemen of af te schaffen. -->
  <div id="wetten" class="paneel verborgen"></div>
  <!-- Het debugvenster (js/debugvenster.js, onder D; werklijst 169): +50 bouwmateriaal, een gezin, de bouwplaatsen af,
       de marskramer. Aan tot de Steam-versie (T.DEBUG_INSTELLINGEN.aan). -->
  <div id="debug" class="paneel verborgen"></div>

  <!-- De spelregels (js/hud.js, T.ui.openSpelregels; de lijst in js/opties.js): de keuzes, de
       namen, en de werkbank met alle getallen. Ze horen bij een spel en liggen vast als het begint (vraag 172). -->
  <div id="spelregels" class="paneel verborgen"></div>
  <!-- Settings (js/instellingen.js; vraag 172): wat van jou is en niet van het spel: het beeld, het hele scherm, de
       taal en de toetsen. -->
  <div id="instellingen" class="paneel verborgen"></div>

  <!-- Het titelscherm en het menu (js/menu.js; de regels in js/opslaan.js): het spel opent op het
       titelscherm, tekst over de wereld, en in het spel opent Esc het menu op papier (vraag 172). -->
  <div id="menu" class="verborgen"></div>
  <div id="opgeslagen" aria-live="polite" data-t="opgeslagen"></div>

  <div id="plek"></div>
  <!-- Het briefje bij een huis (js/huisbriefje.js, 2c): wat het huis wil, als de muis erop staat. -->
  <div id="huisbriefje" class="verborgen" aria-live="polite"></div>

  <div id="berichten"></div>
  <div id="tooltip" class="verborgen"></div>

  <div id="dialoog" class="paneel verborgen">
    <div id="dialoog-naam"></div>
    <p id="dialoog-tekst"></p>
    <div id="dialoog-keuzes"></div>
  </div>

  <div id="overlay" class="verborgen">
    <div class="paneel kaart">
      <h1 id="overlay-titel"></h1>
      <div id="overlay-tekst"></div>
      <button id="overlay-knop"></button>
    </div>
  </div>

  <!-- De fotomodus (H, js/main.js): alles van het beeld, behalve dit briefje, dat even blijft staan en wegvaagt. -->
  <div id="foto-wenk"></div>

  <!-- De scène op Sint-Maarten (js/regie.js): zwarte banden boven en onder, een zin onderin, en aan het eind zwart. -->
  <div id="regie" class="verborgen"><div id="regie-zin"></div></div>

  <!-- Gewone scripts, geen modules: zo werkt het spel ook als je index.html los opent.
       beelden/beschrijving.js hoort bij de pixel art (gemaakt door naar-spel.cjs), tegels/tegels.js
       en kaarten/kaarten.js bij de kaarten die Marcel in Tiled tekent (naar-tiled.cjs, npm run
       tiled, en naar-kaarten.cjs, npm run kaarten): alle drie als script, want fetch mag niet
       vanaf file://. -->
  <script src="beelden/beschrijving.js"></script>
  <script src="beelden/ogen.js"></script>
  <script src="beelden/handen.js"></script>
  <script src="tegels/tegels.js"></script>
  <script src="tegels/bouwfasen.js"></script>
  <script src="tegels/daksneeuw.js"></script>
  <script src="tegels/brandfasen.js"></script>
  <script src="kaarten/kaarten.js"></script>
  <script src="js/tijd.js"></script>
  <script src="js/dag.js"></script>
  <script src="js/weer.js"></script>
  <script src="js/voorraad.js"></script>
  <script src="js/wereld.js"></script>
  <script src="js/mist.js"></script>
  <script src="js/mensen.js"></script>
  <script src="js/vee.js"></script>
  <script src="js/gebouwen.js"></script>
  <script src="js/bouwstijl.js"></script>
  <script src="js/behoeften.js"></script>
  <script src="js/wijngaard.js"></script>
  <script src="js/handel.js"></script>
  <script src="js/bode.js"></script>
  <script src="js/heer.js"></script>
  <script src="js/kaart.js"></script>
  <script src="js/gebied.js"></script>
  <script src="js/dorp.js"></script>
  <script src="js/maker.js"></script>
  <script src="js/hoogte.js"></script>
  <script src="js/eiland.js"></script>
  <script src="js/minikaart.js"></script>
  <script src="js/pad.js"></script>
  <script src="js/lopen.js"></script>
  <script src="js/akkers.js"></script>
  <script src="js/veldwerk.js"></script>
  <script src="js/bewoners.js"></script>
  <script src="js/begin.js"></script>
  <script src="js/bouwen.js"></script>
  <script src="js/kar.js"></script>
  <script src="js/wegen.js"></script>
  <script src="js/afbreken.js"></script>
  <script src="js/boerderij.js"></script>
  <script src="js/bos.js"></script>
  <script src="js/beesten.js"></script>
  <script src="js/paden.js"></script>
  <script src="js/treden.js"></script>
  <script src="js/wetten.js"></script>
  <script src="js/herberg.js"></script>
  <script src="js/zien.js"></script>
  <script src="js/rovers.js"></script>
  <script src="js/soldaten.js"></script>
  <script src="js/kiezen.js"></script>
  <script src="js/heervaart.js"></script>
  <script src="js/statussen.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/koorts.js"></script>
  <script src="js/leven.js"></script>
  <script src="js/kleinleven.js"></script>
  <script src="js/versiering.js"></script>
  <script src="js/markt.js"></script>
  <script src="js/praatje.js"></script>
  <script src="js/einde.js"></script>
  <script src="js/bazen.js"></script>
  <script src="js/grillen.js"></script>
  <script src="js/raad.js"></script>
  <script src="js/iso.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/balk.js"></script>
  <script src="js/huisbriefje.js"></script>
  <script src="js/gebouwbriefje.js"></script>
  <script src="js/brieven.js"></script>
  <script src="js/wettenmenu.js"></script>
  <script src="js/debugvenster.js"></script>
  <script src="js/instellingen.js"></script>
  <script src="js/gesprekken.js"></script>
  <script src="js/gesprek.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/quest.js"></script>
  <script src="js/dialoog.js"></script>
  <script src="js/verkennen.js"></script>
  <script src="js/gevecht.js"></script>
  <script src="js/regie.js"></script>
  <script src="js/tik.js"></script>
  <script src="js/doorkijk.js"></script>
  <script src="js/gl.js"></script>
  <script src="js/tekenen.js"></script>
  <script src="js/opslaan.js"></script>
  <!-- Na alle regels en gesprekken: de spelregels nemen hun waarden als standaard. -->
  <script src="js/opties.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
