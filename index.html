<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aardschok · proefje</title>
  <link rel="stylesheet" href="stijl.css">
</head>
<body>
  <canvas id="scherm"></canvas>

  <div id="hud">
    <div id="leeftijd" class="paneel">
      <div class="kop">Leeftijd</div>
      <div id="leeftijd-jaren"></div>
      <div class="balk"><div id="leeftijd-vul"></div></div>
      <div id="leeftijd-rest"></div>
    </div>
    <button id="sluip-knop" class="paneel" title="Sluipen: trager, maar monsters merken je pas van dichterbij op"><kbd>S</kbd> Sluipen</button>
    <div id="inventaris"></div>
  </div>

  <div id="plek"></div>
  <div id="volgorde" class="paneel"></div>

  <!-- Onderaan: de spreuken staan er altijd, de actiepunten en knoppen schuiven erbij zodra
       het gevecht begint. -->
  <div id="onder">
    <div id="actiebalk" class="paneel">
      <div id="ap"></div>
      <div id="knoppen">
        <button data-actie="slaan"><kbd>1</kbd> Slaan <span class="kost">3</span></button>
        <button data-actie="deur" class="verborgen"><kbd>D</kbd> Deur dicht <span class="kost">1</span></button>
        <button data-actie="einde"><kbd>spatie</kbd> Einde beurt</button>
      </div>
    </div>
    <div id="spreukbalk" class="paneel"></div>
  </div>

  <div id="berichten"></div>
  <div id="tooltip" class="verborgen"></div>

  <div id="dialoog" class="paneel verborgen">
    <div id="dialoog-naam"></div>
    <p id="dialoog-tekst"></p>
    <div id="dialoog-keuzes"></div>
  </div>

  <div id="overlay" class="verborgen">
    <div class="paneel kaart">
      <h1 id="overlay-titel"></h1>
      <div id="overlay-tekst"></div>
      <button id="overlay-knop"></button>
    </div>
  </div>

  <div id="hulp">
    Klik om te lopen, te praten of iets te gebruiken. <kbd>S</kbd> sluipen<br>
    Spreuken: <kbd>2</kbd> vuurschicht · <kbd>3</kbd> dwaallicht · <kbd>4</kbd> windstoot<br>
    <kbd>Esc</kbd> of rechtsklik legt een spreuk weer weg<br>
    In een gevecht: <kbd>1</kbd> slaan · <kbd>D</kbd> deur dicht · <kbd>spatie</kbd> einde beurt
  </div>

  <!-- Gewone scripts, geen modules: zo werkt het spel ook als je index.html los opent.
       beelden/beschrijving.js hoort bij de pixel art (gemaakt door naar-spel.cjs), tegels/tegels.js
       en kaarten/kaarten.js bij de kaarten die Marcel in Tiled tekent (naar-tiled.cjs, npm run
       tiled, en naar-kaarten.cjs, npm run kaarten): alledrie als script, want fetch mag niet
       vanaf file://. -->
  <script src="beelden/beschrijving.js"></script>
  <script src="tegels/tegels.js"></script>
  <script src="kaarten/kaarten.js"></script>
  <script src="js/leeftijd.js"></script>
  <script src="js/wereld.js"></script>
  <script src="js/kaart.js"></script>
  <script src="js/gebied.js"></script>
  <script src="js/pad.js"></script>
  <script src="js/spreuken.js"></script>
  <script src="js/iso.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dialoog.js"></script>
  <script src="js/verkennen.js"></script>
  <script src="js/gevecht.js"></script>
  <script src="js/toveren.js"></script>
  <script src="js/tekenen.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
