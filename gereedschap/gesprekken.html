<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aardschok · gesprekken</title>
  <link rel="stylesheet" href="../stijl.css">
  <link rel="stylesheet" href="gesprekken-tool.css">
</head>
<body>
  <header class="gt-kop">
    <h1>Gesprekken</h1>
    <label>Persoon
      <select id="gt-persoon"></select>
    </label>
    <button id="gt-nieuw-persoon" type="button">+ nieuw persoon</button>
    <div class="gt-zoek-doos">
      <input id="gt-zoek" type="search" placeholder="zoek een zin, bij iedereen…" autocomplete="off">
      <div id="gt-zoek-uit" class="gt-zoek-uit verborgen"></div>
    </div>
    <div class="gt-vul"></div>
    <a class="gt-naar" href="quests.html">Quests &rarr;</a>
    <a class="gt-naar" href="wereld.html">Wereld &rarr;</a>
    <a class="gt-naar" href="index.html">Alle gereedschap</a>
    <button id="gt-proberen" type="button">Proberen &#9656;</button>
    <span id="gt-status" class="gt-status"></span>
    <button id="gt-opslaan" type="button" class="gt-primair">Opslaan</button>
  </header>

  <div id="gt-opmerking-melding" class="gt-melding verborgen"></div>

  <!-- De situatiebalk: waar je doorheen kijkt. Alles eronder wordt getekend zoals het gesprek in
       díe situatie loopt. Zie het kop-commentaar van gesprekken-tool.js. -->
  <div id="gt-situaties" class="gt-situatiebalk"></div>

  <main class="gt-blad">
    <div id="gt-persoon-editor"></div>
    <!-- Het kaartje: de vorm van het gesprek in deze situatie, vanzelf neergelegd. Klikken springt
         naar dat stuk in de tekst eronder. -->
    <div id="gt-kaart" class="gt-kaart"></div>
    <div id="gt-gesprek"></div>

    <section class="paneel gt-quest-doos">
      <div id="gt-quest"></div>
    </section>

    <section class="paneel gt-controle">
      <h2>Controle<div class="gt-vul"></div><span id="gt-controle-tal" class="gt-status"></span></h2>
      <div id="gt-fouten-inhoud"></div>
    </section>
  </main>

  <!-- Het gesprek spelen zoals het spel dat doet, vanaf de situatie die bovenin staat. -->
  <aside id="gt-proef" class="paneel gt-proef verborgen"></aside>

  <!-- Verborgen meetrek met dezelfde id's als in het spel (zie stijl.css: #dialoog, #dialoog-tekst,
       #dialoog-keuzes). Zo meet het gereedschap met de echte styling hoe breed tekst in het spel
       past, in plaats van dat zelf te gokken. -->
  <div id="dialoog" class="paneel gt-meet">
    <p id="dialoog-tekst"></p>
    <div id="dialoog-keuzes"><button type="button"></button></div>
  </div>

  <!-- Dezelfde spelbestanden als het spel, gewoon geladen: gesprekken.js en quests.js voor de
       gegevens, gesprek.js en quest.js voor de regels. Dit gereedschap voegt alleen het scherm
       toe; het beoordeelt een voorwaarde nooit zelf. -->
  <script src="../js/gesprekken.js"></script>
  <script src="../js/gesprek.js"></script>
  <script src="../js/quests.js"></script>
  <script src="../js/quest.js"></script>
  <script src="bronblok.js"></script>
  <script src="gesprekken-tool.js"></script>
  <!-- De schrijver start zichzelf niet: gereedschap/wereld.html gebruikt hem ook, en daar hangt
       hij in een paneel dat pas opengaat als je een poppetje aanklikt. -->
  <script>Toren.gesprekkenTool.start();</script>
</body>
</html>
